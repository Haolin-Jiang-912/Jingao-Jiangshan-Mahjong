<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>鸡歪麻将厅</title><link rel="stylesheet" href="style.css?v=10"></head>
<body class="cover-page"><main class="cover-wrap">
  <div class="scanlines"></div><div class="cloud c1"></div><div class="cloud c2"></div>
  <section class="cover-card pixel-border">
    <p class="tiny">JINGAO PIXEL CLUB PRESENTS</p>
    <h1>鸡歪麻将厅</h1>
    <p class="tagline">锦高优秀学子养成计划 · 江山麻将</p>
    <a class="start-btn" href="game.html?mode=8">单机 · 8盘一局 <span>▶</span></a><br>
    <a class="start-btn alt" href="game.html?mode=ju">单机 · 局麻 30分起底 <span>▶</span></a>
    <div class="net-entry">
      <p class="tiny">想和好友异地联机？</p>
      <input id="playerName" type="text" placeholder="你的昵称" maxlength="8" autocomplete="off">
      <a id="createRoom" class="start-btn" href="#">创建房间 <span>▶</span></a><br>
      <input id="roomCode" type="text" placeholder="输入房间号" maxlength="8" autocomplete="off" style="text-transform:uppercase">
      <a id="joinRoom" class="start-btn alt" href="#">加入房间 <span>▶</span></a>
    </div>
    <p class="credit">Developed by Harry Jiang</p>
    <script>
      const roomIn=document.getElementById('roomCode'), joinBtn=document.getElementById('joinRoom'), nameIn=document.getElementById('playerName');
      function randCode(){return Math.random().toString(36).slice(2,8).toUpperCase();}
      function getName(){return encodeURIComponent((nameIn.value.trim()||'玩家').slice(0,8));}
      document.getElementById('createRoom').onclick=e=>{e.preventDefault();location.href='game.html?v=10&mode=8&role=host&room='+randCode()+'&name='+getName();};
      joinBtn.onclick=e=>{e.preventDefault();const code=roomIn.value.trim().toUpperCase();if(!code){alert('请输入房间号');roomIn.focus();return;}location.href='game.html?v=10&mode=8&role=client&room='+code+'&name='+getName();};
      roomIn.addEventListener('keypress',e=>{if(e.key==='Enter')joinBtn.click();});
    </script>
  </section>
</main></body></html>
