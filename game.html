<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>鸡歪麻将厅 · 牌局</title><link rel="stylesheet" href="style.css?v=9"></head>
<body class="game-page"><div class="scanlines"></div><div id="rotateTip"><div class="ph">📱</div><b>请横屏游玩</b><small>把手机转过来，牌桌更宽敞</small><button id="tipGo">仍要竖屏继续</button></div>
<script>
/* 手机端检测：UA + 屏幕宽度判定，不依赖 CSS orientation 媒体查询 */
(function(){
  var isMobile=/Android|iPhone|iPad|iPod|Mobile|Windows Phone|Tablet|MicroMessenger/i.test(navigator.userAgent)||window.innerWidth<=920;
  if(!isMobile)return;
  document.body.classList.add('mobile-mode');
  var tip=document.getElementById('rotateTip');if(tip)tip.style.display='none';
  function init(){
    /* 把 netStatus 从 header 移到 body，避免 header display:none 导致它不可见 */
    var ns=document.getElementById('netStatus');
    if(ns&&ns.parentNode!==document.body)document.body.appendChild(ns);
    fit();
  }
  function fit(){
    var d=document.querySelector('.desk-table');if(!d)return;
    var W=window.innerWidth,H=window.innerHeight,DW=1000,DH=640;
    var s=Math.min(W/DW,H/DH);
    d.style.transform='translate(-50%,-50%) scale('+s+')';
  }
  window.addEventListener('resize',fit);
  window.addEventListener('orientationchange',function(){setTimeout(fit,100);setTimeout(fit,500);});
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);
  else init();
})();
</script>
